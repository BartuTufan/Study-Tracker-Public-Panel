<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#121212',
                        cardDark: '#1E1E1E',
                        cardLighter: '#2A2A2A',
                        accent: '#8B5CF6',
                        accentHover: '#7C3AED',
                        textMuted: '#9CA3AF'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #F3F4F6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: #1E1E1E; border: 1px solid #2D2D2D; border-radius: 12px; }
        .progress-bar-bg { background-color: #374151; border-radius: 999px; overflow: hidden; height: 8px; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .collapsible-content { display: none; }
        .collapsible-content.open { display: block; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="border-b border-gray-800 bg-bgDark sticky top-0 z-40 shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex items-center justify-between h-16 gap-2">
                <div class="flex items-center gap-2.5 text-lg sm:text-xl font-bold shrink-0">
                    <div class="bg-accent text-white p-2 rounded-lg shadow-[0_0_10px_rgba(139,92,246,0.5)] flex items-center justify-center w-9 h-9">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <span class="hidden sm:inline">Study Tracker</span>
                </div>
                <div class="flex items-center gap-2 sm:gap-4">
                    <div class="flex space-x-1 overflow-x-auto py-2 no-scrollbar">
                        <button onclick="switchTab('dashboard')" class="tab-btn active px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium bg-gray-800 text-white shrink-0" data-tab="dashboard">Home</button>
                        <button onclick="switchTab('subjects')" class="tab-btn px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-textMuted hover:bg-gray-800 hover:text-white transition-colors shrink-0" data-tab="subjects">Kitaplık</button>
                        <button onclick="switchTab('daily')" class="tab-btn px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-textMuted hover:bg-gray-800 hover:text-white transition-colors shrink-0" data-tab="daily">Günlük</button>
                        <button onclick="switchTab('history')" class="tab-btn px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-textMuted hover:bg-gray-800 hover:text-white transition-colors shrink-0" data-tab="history">History</button>
                    </div>

                    <div id="auth-container" class="shrink-0 ml-2">
                        <button id="login-btn" onclick="loginWithGoogle()" class="bg-white text-gray-900 font-semibold px-3 py-1.5 rounded-md text-xs sm:text-sm flex items-center gap-2 hover:bg-gray-200 transition-colors shadow">
                            <i class="fa-brands fa-google text-red-500"></i> <span class="hidden sm:inline">Giriş Yap</span>
                        </button>
                        <div id="user-profile" class="hidden flex items-center gap-2">
                            <img id="user-avatar" src="" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border border-accent">
                            <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 bg-gray-800 p-1.5 rounded" title="Çıkış Yap"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6 sm:py-8">
        
        <div id="dashboard" class="tab-content active space-y-6">
            <div class="glass-panel p-5 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4 relative overflow-hidden">
                <div class="flex items-center gap-4 w-full sm:w-auto">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-orange-500/20 text-orange-500 flex items-center justify-center text-2xl sm:text-3xl shadow-[0_0_20px_rgba(249,115,22,0.3)] z-10 shrink-0">
                        <i class="fa-solid fa-fire"></i>
                    </div>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-bold"><span id="dash-streak">0</span> Günlük Seri</h2>
                        <p id="sync-status" class="text-textMuted text-xs sm:text-sm">Yükleniyor...</p>
                    </div>
                </div>
                <div class="text-left sm:text-right w-full sm:w-auto border-t sm:border-t-0 pt-3 sm:pt-0 border-gray-800 flex sm:block justify-between items-center">
                    <span class="text-xs text-textMuted block">Bugünkü Durum</span>
                    <span id="streak-status-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mt-1 bg-gray-800 text-textMuted">Çalışma Bekleniyor</span>
                </div>
            </div>

            <div class="glass-panel p-4">
                <div class="text-xs font-bold text-textMuted uppercase tracking-wider mb-3"><i class="fa-solid fa-calendar-days text-accent mr-1"></i> Çalışma Takvimi</div>
                <div id="calendar-strip" class="flex gap-2 overflow-x-auto pb-2"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-panel p-5 sm:p-6 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-base sm:text-lg font-bold text-textMuted flex items-center gap-2">
                            <i class="fa-solid fa-bullseye text-accent"></i> GÜNLÜK PLAN (<span id="selected-date-label">Bugün</span>)
                        </h3>
                        <button onclick="openPlanModal()" class="text-xs bg-accent hover:bg-accentHover px-3 py-1.5 rounded-md text-white transition-colors shrink-0">
                            <i class="fa-solid fa-plus mr-1"></i> Plan Ekle
                        </button>
                    </div>
                    <div id="planned-tasks-container" class="space-y-3 flex-1"></div>
                </div>

                <div class="glass-panel p-5 sm:p-6">
                    <h3 class="text-base sm:text-lg font-bold text-textMuted mb-6"><i class="fa-solid fa-book-open text-accent mr-2"></i> Kitaplık Özeti</h3>
                    <div id="dash-subjects-container" class="space-y-6"></div>
                </div>
            </div>

            <div class="glass-panel p-5 sm:p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base sm:text-lg font-bold text-textMuted"><i class="fa-solid fa-chart-line text-accent mr-2"></i> HAFTALIK İSTATİSTİK</h3>
                    <div class="text-xs sm:text-sm font-bold text-accent bg-gray-800 px-3 py-1 rounded" id="weekly-total">0 Soru</div>
                </div>
                <div class="w-full h-56 sm:h-64">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>

        <div id="subjects" class="tab-content space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl sm:text-2xl font-bold">Kitaplık</h2>
                <button onclick="openModal('bookModal')" class="bg-accent hover:bg-accentHover text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors shrink-0">
                    <i class="fa-solid fa-plus mr-1 sm:mr-2"></i> Yeni Kitap
                </button>
            </div>
            
            <div class="flex gap-2 bg-cardDark p-2 rounded-lg overflow-x-auto border border-gray-800" id="subject-filters"></div>
            <div id="books-container" class="space-y-4 mt-6"></div>
        </div>

        <div id="daily" class="tab-content space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl sm:text-2xl font-bold">Günlük</h2>
                <button onclick="openLogSessionModal()" class="bg-accent hover:bg-accentHover text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors shrink-0">
                    <i class="fa-solid fa-plus mr-1 sm:mr-2"></i> Oturum Ekle
                </button>
            </div>
            <div id="daily-container" class="space-y-4"></div>
        </div>

        <div id="history" class="tab-content space-y-6">
            <h2 class="text-xl sm:text-2xl font-bold mb-6">Activity Log</h2>
            <div class="glass-panel p-2 border border-gray-800">
                <div id="history-container" class="space-y-1"></div>
            </div>
        </div>
    </main>

    <div id="completeTaskModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-cardDark w-full max-w-sm rounded-xl shadow-2xl p-6 border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base sm:text-lg font-bold">Görevi Tamamla</h3>
                <button onclick="closeModal('completeTaskModal')" class="text-textMuted hover:text-white"><i class="fa-solid fa-times"></i></button>
            </div>
            <input type="hidden" id="completingTaskId">
            <p id="completeTaskInfo" class="text-xs text-textMuted mb-4"></p>
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs text-green-400 mb-1">Doğru Sayısı</label>
                    <input type="number" id="taskCorrect" min="0" value="0" oninput="calculateTaskTotalQuestions()" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-red-400 mb-1">Yanlış Sayısı</label>
                    <input type="number" id="taskIncorrect" min="0" value="0" oninput="calculateTaskTotalQuestions()" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-textMuted mb-1">Toplam Soru / Test</label>
                    <input type="number" id="taskTotalQs" readonly class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm bg-opacity-50">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal('completeTaskModal')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2.5 rounded text-sm">İptal</button>
                <button onclick="confirmCompletePlannedTask()" class="flex-1 bg-accent hover:bg-accentHover text-white py-2.5 rounded font-bold text-sm">Kaydet & Bitir</button>
            </div>
        </div>
    </div>

    <div id="planTaskModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-cardDark w-full max-w-md rounded-xl shadow-2xl p-6 border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg sm:text-xl font-bold">Görev Planla</h3>
                <button onclick="closeModal('planTaskModal')" class="text-textMuted hover:text-white"><i class="fa-solid fa-times"></i></button>
            </div>
            <form onsubmit="savePlannedTask(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-textMuted mb-1">Ders Seç</label>
                    <select id="planSubject" required onchange="populatePlanBooks()" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                        <option value="">Ders seç...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Kitap Seç</label>
                    <select id="planBook" required onchange="populatePlanChapters()" disabled class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm disabled:opacity-50">
                        <option value="">Önce ders seçin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Bölüm / Kısım Seç</label>
                    <select id="planChapter" required onchange="populatePlanTopics()" disabled class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm disabled:opacity-50">
                        <option value="">Önce kitap seçin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Konu Seç</label>
                    <select id="planTopic" required onchange="updatePlanMaxTests()" disabled class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm disabled:opacity-50">
                        <option value="">Önce bölüm seçin</option>
                    </select>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm text-textMuted">Hedef Test Sayısı</label>
                        <span id="max-test-hint" class="text-[11px] text-accent"></span>
                    </div>
                    <input type="number" id="planTestCount" required min="1" value="1" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-accent hover:bg-accentHover text-white py-3 rounded-lg font-bold text-sm">Planı Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div id="bookModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-cardDark w-full max-w-lg rounded-xl shadow-2xl p-6 border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg sm:text-xl font-bold" id="bookModalTitle">Yeni Kitap Ekle</h3>
                <button onclick="closeModal('bookModal')" class="text-textMuted hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            
            <div id="book-extra-actions" class="hidden flex gap-2 mb-6 pb-4 border-b border-gray-800">
                <button type="button" onclick="deleteBookFromModal()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium py-2 rounded-lg text-xs sm:text-sm transition-colors border border-red-500/30">
                    <i class="fa-solid fa-trash mr-1"></i> Kitabı Sil
                </button>
            </div>

            <form id="bookForm" onsubmit="handleBookSubmit(event)" class="space-y-4">
                <input type="hidden" id="editBookId" value="">
                <div>
                    <label class="block text-sm text-textMuted mb-1">Ders</label>
                    <select id="bookSubject" required class="w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-white text-sm">
                        <option value="Matematik">Matematik</option>
                        <option value="Fizik">Fizik</option>
                        <option value="Kimya">Kimya</option>
                        <option value="Biyoloji">Biyoloji</option>
                        <option value="Türkçe">Türkçe</option>
                        <option value="Geometri">Geometri</option>
                        <option value="Sosyal">Sosyal</option>
                        <option value="Olimpiyat Matematik">Olimpiyat Matematik</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Kitap Adı</label>
                    <input type="text" id="bookName" required class="w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-white text-sm" placeholder="Kitap adı...">
                </div>
                <div class="pt-4 border-t border-gray-800">
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-sm text-textMuted">KONULAR</span>
                        <button type="button" onclick="addTopicField()" class="text-xs bg-gray-800 px-3 py-1.5 rounded-md hover:bg-gray-700">+ Konu Ekle</button>
                    </div>
                    <div id="topicsList" class="space-y-4"></div>
                </div>
                <div class="pt-4">
                    <button type="submit" class="w-full bg-accent hover:bg-accentHover text-white py-3 rounded-lg font-bold text-sm transition-colors">Kitabı Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editTopicModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-cardDark w-full max-w-sm rounded-xl shadow-2xl p-6 border border-gray-700">
            <h3 class="text-base sm:text-lg font-bold mb-4">Konu İlerlemesini Düzenle</h3>
            <input type="hidden" id="etBookId">
            <input type="hidden" id="etTopicId">
            <div class="mb-4">
                <label class="block text-sm text-textMuted mb-1">Tamamlanan Testler</label>
                <input type="number" id="etCompleted" min="0" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
            </div>
            <div class="mb-6">
                <label class="block text-sm text-textMuted mb-1">Toplam Test</label>
                <input type="number" id="etTotal" min="1" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal('editTopicModal')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2.5 rounded text-sm">İptal</button>
                <button onclick="saveEditedTopic()" class="flex-1 bg-accent hover:bg-accentHover text-white py-2.5 rounded font-bold text-sm">Güncelle</button>
            </div>
        </div>
    </div>

    <div id="logModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50 p-4">
        <div class="bg-cardDark w-full max-w-md rounded-xl shadow-2xl p-6 border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg sm:text-xl font-bold" id="logModalTitle">Çalışma Oturumunu Ekle</h3>
                <button onclick="closeModal('logModal')" class="text-textMuted hover:text-white"><i class="fa-solid fa-times"></i></button>
            </div>
            <form id="logForm" onsubmit="saveLogSession(event)" class="space-y-4">
                <input type="hidden" id="logId" value="">
                <div>
                    <label class="block text-sm text-textMuted mb-1">Tarih</label>
                    <input type="date" id="logDate" required class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Ders</label>
                    <select id="logSubject" required onchange="populateLogBooks()" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                        <option value="">Ders seç...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Kitap</label>
                    <select id="logBook" required onchange="populateLogChapters()" disabled class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm disabled:opacity-50">
                        <option value="">Önce ders seçin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Bölüm / Kısım Seç</label>
                    <select id="logChapter" required onchange="populateLogTopics()" disabled class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm disabled:opacity-50">
                        <option value="">Önce kitap seçin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-textMuted mb-1">Konu</label>
                    <select id="logTopic" required disabled class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm disabled:opacity-50">
                        <option value="">Önce bölüm seçin</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-textMuted mb-1">Test Sayısı</label>
                        <input type="number" id="logTests" required min="1" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-sm text-textMuted mb-1">Toplam Soru</label>
                        <input type="number" id="logQs" required min="1" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm" readonly placeholder="Otomatik hesaplanır">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-green-400 mb-1">Doğru Sayısı</label>
                        <input type="number" id="logCorrect" required min="0" value="0" oninput="calculateTotalQuestions()" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-sm text-red-400 mb-1">Yanlış Sayısı</label>
                        <input type="number" id="logIncorrect" required min="0" value="0" oninput="calculateTotalQuestions()" class="w-full bg-bgDark border border-gray-700 rounded p-2.5 text-white text-sm">
                    </div>
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-accent hover:bg-accentHover text-white py-3 rounded-lg font-bold text-sm">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🔑 FIREBASE CONFIGURATION (Kendi Firebase bilgilerinizi buraya yapıştırın)
        const firebaseConfig = {
            apiKey: "AIzaSyDvRzmjUXKUQuYHSnc_nTboUk26cpvNkRk",
            authDomain: "studytrackerpublic.firebaseapp.com",
            projectId: "studytrackerpublic",
            storageBucket: "studytrackerpublic.firebasestorage.app",
            messagingSenderId: "539829878982",
            appId: "1:539829878982:web:6bc67e5d47adb8d4fd57c7",
            measurementId: "G-XD757SKL2P"
        };

        // Firebase Başlatma
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        function createDefaultState() {
            return {
                streak: 0,
                lastActiveDate: null,
                activeSubjectTab: 'All',
                selectedDate: getTodayStr(),
                plannedTasks: [],
                books: [],
                dailyLogs: [],
                history: []
            };
        }

        let state = createDefaultState();

        const subjectsList = ['Matematik', 'Fizik', 'Kimya', 'Biyoloji', 'Türkçe', 'Geometri', 'Sosyal', 'Olimpiyat Matematik'];

        // DİNAMİK POP-UP GİRİŞ SİSTEMİ
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            // Google hesap seçiciyi her girişte zorunlu aç
            provider.setCustomParameters({ prompt: 'select_account' });
            
            auth.signInWithPopup(provider).catch((error) => {
                if (error.code !== "auth/popup-closed-by-user") {

        function saveData() {
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).set(state)
                    .then(() => console.log("Firebase'e kaydoldu."))
                    .catch((err) => console.error("Firebase kayıt hatası:", err));
            } else {
                localStorage.setItem('studyTrackerData', JSON.stringify(state));
            }
        }

        function loadUserDataFromLocal() {
            const savedData = localStorage.getItem('studyTrackerData');
            if (savedData) {
                try {
                    let remoteData = JSON.parse(savedData);
                    state = parseState(remoteData);
                } catch(e) { state = createDefaultState(); }
            }
        }

        async function loadUserDataFromFirebase() {
            if (!currentUser) return;
            try {
                const doc = await db.collection("users").doc(currentUser.uid).get();
                if (doc.exists) {
                    state = parseState(doc.data());
                } else {
                    // İlk kez giren kullanıcı için sıfır veri kaydet
                    state = createDefaultState();
                    saveData();
                }
            } catch (err) {
                console.error("Firebase veri yükleme hatası:", err);
            }
        }

        function parseState(remoteData) {
            return {
                streak: remoteData.streak || 0,
                lastActiveDate: remoteData.lastActiveDate || null,
                activeSubjectTab: remoteData.activeSubjectTab || 'All',
                selectedDate: remoteData.selectedDate || getTodayStr(),
                plannedTasks: remoteData.plannedTasks || [],
                books: (remoteData.books || []).map(b => ({
                    ...b,
                    topics: (b.topics || []).map(t => ({
                        id: t.id || generateId(),
                        name: t.name || 'İsimsiz Konu',
                        chapter: t.chapter || '',
                        totalTests: t.totalTests || 1,
                        completedTests: t.completedTests || 0
                    }))
                })),
                dailyLogs: remoteData.dailyLogs || [],
                history: remoteData.history || []
            };
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function getTodayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

        function checkStreak() {
            const today = getTodayStr();
            if(state.lastActiveDate && state.lastActiveDate !== today) {
                const last = new Date(state.lastActiveDate);
                const curr = new Date(today);
                const diff = Math.ceil(Math.abs(curr - last) / (1000 * 60 * 60 * 24));
                if(diff > 1) state.streak = 0;
            }
        }
        
        function updateStreak() {
            const today = getTodayStr();
            if(state.lastActiveDate !== today) {
                state.streak++;
                state.lastActiveDate = today;
            }
        }

        function calculateTotalQuestions() {
            let correct = parseInt(document.getElementById('logCorrect').value) || 0;
            let incorrect = parseInt(document.getElementById('logIncorrect').value) || 0;
            document.getElementById('logQs').value = correct + incorrect;
        }

        function calculateTaskTotalQuestions() {
            let correct = parseInt(document.getElementById('taskCorrect').value) || 0;
            let incorrect = parseInt(document.getElementById('taskIncorrect').value) || 0;
            document.getElementById('taskTotalQs').value = correct + incorrect;
        }

        function moveBook(bookId, direction) {
            let bookIndex = state.books.findIndex(b => b.id === bookId);
            if (bookIndex === -1) return;
            
            let currentBook = state.books[bookIndex];
            let sameSubjectBooks = state.books.filter(b => b.subject === currentBook.subject);
            let localIdx = sameSubjectBooks.findIndex(b => b.id === bookId);

            if (direction === 'up' && localIdx > 0) {
                let prevBookInSub = sameSubjectBooks[localIdx - 1];
                let prevIdx = state.books.findIndex(b => b.id === prevBookInSub.id);
                state.books.splice(bookIndex, 1);
                state.books.splice(prevIdx, 0, currentBook);
                saveData();
                renderBooks();
            } else if (direction === 'down' && localIdx < sameSubjectBooks.length - 1) {
                let nextBookInSub = sameSubjectBooks[localIdx + 1];
                let nextIdx = state.books.findIndex(b => b.id === nextBookInSub.id);
                state.books.splice(bookIndex, 1);
                state.books.splice(nextIdx, 0, currentBook);
                saveData();
                renderBooks();
            }
        }

        function updatePlanMaxTests() {
            let bId = document.getElementById('planBook').value;
            let tId = document.getElementById('planTopic').value;
            let countInput = document.getElementById('planTestCount');
            let hint = document.getElementById('max-test-hint');

            if(!bId || !tId) {
                countInput.max = 1;
                countInput.value = 1;
                hint.innerText = '';
                return;
            }

            let book = state.books.find(b => b.id === bId);
            let topic = book.topics.find(t => t.id === tId);
            let remainingTests = topic.totalTests - topic.completedTests;
            if(remainingTests < 0) remainingTests = 0;

            countInput.max = remainingTests > 0 ? remainingTests : 1;
            countInput.value = remainingTests > 0 ? 1 : 0;
            hint.innerText = `Kalan: ${remainingTests} test (Maks: ${remainingTests})`;
        }

        function savePlannedTask(e) {
            e.preventDefault();
            let subject = document.getElementById('planSubject').value;
            let bookId = document.getElementById('planBook').value;
            let topicId = document.getElementById('planTopic').value;
            let testCount = parseInt(document.getElementById('planTestCount').value);

            let book = state.books.find(b => b.id === bookId);
            let topic = book.topics.find(t => t.id === topicId);
            let remainingTests = topic.totalTests - topic.completedTests;

            if (testCount > remainingTests) {
                alert(`Bu konudan en fazla ${remainingTests} test ekleyebilirsiniz!`);
                return;
            }

            state.plannedTasks.push({
                id: generateId(), date: state.selectedDate,
                subject, bookId, bookName: book.name,
                topicId, topicName: topic.name, testCount, completed: false
            });

            saveData();
            closeModal('planTaskModal');
            renderPlannedTasks();
        }

        function openCompleteTaskModal(taskId) {
            let task = state.plannedTasks.find(t => t.id === taskId);
            if(!task || task.completed) return;

            document.getElementById('completingTaskId').value = taskId;
            document.getElementById('completeTaskInfo').innerText = `${task.bookName} • ${task.topicName} (${task.testCount} Test)`;
            
            let defaultQs = task.testCount * 10;
            document.getElementById('taskCorrect').value = defaultQs;
            document.getElementById('taskIncorrect').value = 0;
            calculateTaskTotalQuestions();

            openModal('completeTaskModal');
        }

        function confirmCompletePlannedTask() {
            let taskId = document.getElementById('completingTaskId').value;
            let task = state.plannedTasks.find(t => t.id === taskId);
            if(!task || task.completed) return;

            let correct = parseInt(document.getElementById('taskCorrect').value) || 0;
            let incorrect = parseInt(document.getElementById('taskIncorrect').value) || 0;
            let questions = correct + incorrect;

            task.completed = true;
            let book = state.books.find(b => b.id === task.bookId);
            let topic = book ? book.topics.find(t => t.id === task.topicId) : null;

            if(topic) {
                topic.completedTests += task.testCount;
                if(topic.completedTests > topic.totalTests) topic.completedTests = topic.totalTests;
            }

            state.dailyLogs.unshift({
                id: generateId(), date: task.date, subject: task.subject, bookId: task.bookId, bookName: book.name,
                topicId: task.topicId, topicName: task.topicName, chapterName: topic ? topic.chapter : '', tests: task.testCount,
                questions: questions, correct: correct, incorrect: incorrect
            });

            updateStreak();
            logHistory('Görev Tamamlandı', `${task.bookName} - ${task.testCount} Test (${correct}D / ${incorrect}Y)`);
            saveData();
            closeModal('completeTaskModal');
            renderAll();
        }

        function saveLogSession(e) {
            e.preventDefault();
            let logId = document.getElementById('logId').value;
            let date = document.getElementById('logDate').value;
            let subject = document.getElementById('logSubject').value;
            let bookId = document.getElementById('logBook').value;
            let topicId = document.getElementById('logTopic').value;
            let tests = parseInt(document.getElementById('logTests').value);
            let correct = parseInt(document.getElementById('logCorrect').value) || 0;
            let incorrect = parseInt(document.getElementById('logIncorrect').value) || 0;
            let questions = correct + incorrect;

            let book = state.books.find(b => b.id === bookId);
            let topic = book ? book.topics.find(t => t.id === topicId) : null;
            let chapterName = topic ? (topic.chapter || '') : '';

            if(logId) {
                let oldLog = state.dailyLogs.find(l => l.id === logId);
                if(oldLog) {
                    let oldBook = state.books.find(b => b.id === oldLog.bookId);
                    let oldTopic = oldBook ? oldBook.topics.find(t => t.id === oldLog.topicId) : null;
                    if(oldTopic) {
                        oldTopic.completedTests -= oldLog.tests;
                        if(oldTopic.completedTests < 0) oldTopic.completedTests = 0;
                    }
                }
                let logIndex = state.dailyLogs.findIndex(l => l.id === logId);
                if(logIndex !== -1) {
                    state.dailyLogs[logIndex] = { id: logId, date, subject, bookId, bookName: book.name, topicId, topicName: topic.name, chapterName, tests, questions, correct, incorrect };
                }
                if(topic) {
                    topic.completedTests += tests;
                    if(topic.completedTests > topic.totalTests) topic.completedTests = topic.totalTests;
                }
                logHistory('Çalışma Kaydı Düzenlendi', `${book.name} - ${tests} Test (${correct}D / ${incorrect}Y)`);
            } else {
                state.dailyLogs.unshift({ id: generateId(), date, subject, bookId, bookName: book.name, topicId, topicName: topic.name, chapterName, tests, questions, correct, incorrect });
                if(topic) {
                    topic.completedTests += tests;
                    if(topic.completedTests > topic.totalTests) topic.completedTests = topic.totalTests;
                }
                updateStreak();
                logHistory('Çalışma Kaydı Eklendi', `${book.name} - ${tests} Test (${correct}D / ${incorrect}Y)`);
            }

            saveData();
            closeModal('logModal');
            renderAll();
        }

        function renderDashboardSubjects() {
            const container = document.getElementById('dash-subjects-container');
            let stats = {};
            state.books.forEach(b => {
                if(!stats[b.subject]) stats[b.subject] = { total: 0, comp: 0 };
                b.topics.forEach(t => {
                    stats[b.subject].total += t.totalTests;
                    stats[b.subject].comp += t.completedTests;
                });
            });
            const html = Object.keys(stats).map(sub => {
                let s = stats[sub];
                let pct = s.total > 0 ? (s.comp / s.total) * 100 : 0;
                return `
                    <div>
                        <div class="flex justify-between text-xs sm:text-sm mb-1">
                            <span class="font-bold">${sub}</span>
                            <span class="text-textMuted">${s.comp} / ${s.total} (${Math.round(pct)}%)</span>
                        </div>
                        <div class="progress-bar-bg h-2">
                            <div class="bg-accent h-full transition-all" style="width: ${pct}%;"></div>

        function getWeekIdentifier(dateStr) {
            let d = new Date(dateStr);
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            let monday = new Date(d.setDate(diff));
            let sunday = new Date(monday);
            sunday.setDate(sunday.getDate() + 6);
            
            let fmt = dt => `${dt.getDate().toString().padStart(2,'0')}.${(dt.getMonth()+1).toString().padStart(2,'0')}.${dt.getFullYear()}`;
            return `${fmt(monday)} - ${fmt(sunday)}`;
        }

        function renderDaily() {
            const container = document.getElementById('daily-container');
            if(state.dailyLogs.length === 0) {
                container.innerHTML = '<p class="text-textMuted text-center text-sm py-10">Henüz çalışma kaydı yok.</p>';
                return;
            }

            let groupedByWeek = {};
            state.dailyLogs.forEach(log => {
                let weekKey = getWeekIdentifier(log.date);
                if(!groupedByWeek[weekKey]) groupedByWeek[weekKey] = [];
                groupedByWeek[weekKey].push(log);
            });

            let weeksHtml = '';
            let wKeys = Object.keys(groupedByWeek).sort((a,b) => {
                let dateA = new Date(a.split(' - ')[0].split('.').reverse().join('-'));
                let dateB = new Date(b.split(' - ')[0].split('.').reverse().join('-'));
                return dateB - dateA;
            });

            wKeys.forEach((weekStr, wIdx) => {
                let wLogs = groupedByWeek[weekStr];
                let wTotalTests = wLogs.reduce((sum, l) => sum + l.tests, 0);
                let wTotalQs = wLogs.reduce((sum, l) => sum + l.questions, 0);
                let wCorrect = wLogs.reduce((sum, l) => sum + (l.correct !== undefined ? l.correct : l.questions), 0);
                let wIncorrect = wLogs.reduce((sum, l) => sum + (l.incorrect !== undefined ? l.incorrect : 0), 0);

                let groupedByDate = {};
                wLogs.forEach(log => {
                    if(!groupedByDate[log.date]) groupedByDate[log.date] = [];
                    groupedByDate[log.date].push(log);

                let datesHtml = '';
                let dKeys = Object.keys(groupedByDate).sort((a,b) => new Date(b) - new Date(a));

                dKeys.forEach((d, dIdx) => {
                    let dLogs = groupedByDate[d];
                    let dTests = dLogs.reduce((sum, l) => sum + l.tests, 0);
                    let dQs = dLogs.reduce((sum, l) => sum + l.questions, 0);
                    let dCorrect = dLogs.reduce((sum, l) => sum + (l.correct !== undefined ? l.correct : l.questions), 0);
                    let dIncorrect = dLogs.reduce((sum, l) => sum + (l.incorrect !== undefined ? l.incorrect : 0), 0);
                    let displayDate = new Date(d).toLocaleDateString('tr-TR', { day:'numeric', month:'long', weekday:'long'});

                    let groupedBySubject = {};
                    dLogs.forEach(l => {
                        if(!groupedBySubject[l.subject]) groupedBySubject[l.subject] = [];
                        groupedBySubject[l.subject].push(l);
                    });

                    let subjectsHtml = '';
                    Object.keys(groupedBySubject).forEach((subName, sIdx) => {
                        let subLogs = groupedBySubject[subName];
                        let subTests = subLogs.reduce((sum, l) => sum + l.tests, 0);
                        let subQs = subLogs.reduce((sum, l) => sum + l.questions, 0);
                        let subCorrect = subLogs.reduce((sum, l) => sum + (l.correct !== undefined ? l.correct : l.questions), 0);
                        let subIncorrect = subLogs.reduce((sum, l) => sum + (l.incorrect !== undefined ? l.incorrect : 0), 0);

                        let rowsHtml = subLogs.map(l => {
                            let corr = l.correct !== undefined ? l.correct : l.questions;
                            let incorr = l.incorrect !== undefined ? l.incorrect : 0;
                            return `
                                <div class="flex items-start gap-3 py-3 border-t border-gray-800 hover:bg-bgDark transition-colors px-2 rounded">
                                    <div class="text-accent mt-0.5 bg-gray-800 p-2 rounded shrink-0"><i class="fa-solid fa-flask"></i></div>
                                    <div class="min-w-0 flex-1">
                                        <div class="font-bold text-xs sm:text-sm text-white truncate">${l.bookName}</div>
                                        <div class="text-[11px] text-textMuted mb-1.5 truncate">${l.chapterName ? l.chapterName+' - ' : ''}${l.topicName}</div>
                                        <div class="flex flex-wrap gap-3 text-[11px] bg-bgDark inline-flex px-2.5 py-1 rounded border border-gray-800">
                                            <div><span class="text-textMuted">Test:</span> <span class="font-bold">${l.tests}</span></div>
                                            <div><span class="text-textMuted">Toplam Soru:</span> <span class="font-bold">${l.questions}</span></div>
                                            <div><span class="text-green-400">Doğru:</span> <span class="font-bold text-green-400">${corr}</span></div>
                                            <div><span class="text-red-400">Yanlış:</span> <span class="font-bold text-red-400">${incorr}</span></div>

                                    </div>
                                    <div class="flex items-center gap-1 shrink-0">

                        let subBoxId = `sub-box-${wIdx}-${dIdx}-${sIdx}`;
                        subjectsHtml += `
                            <div class="bg-bgDark rounded-lg border border-gray-800 mb-2.5">

                                        <i id="icon-${subBoxId}" class="fa-solid fa-chevron-down w-3 text-center"></i>
                                    </div>
                                </div>
                                <div id="${subBoxId}" class="collapsible-content px-2.5 pb-2">${rowsHtml}</div>

                        `;
                    });

                    let dayBoxId = `daily-box-${wIdx}-${dIdx}`;
                    datesHtml += `
                        <div class="bg-cardLighter rounded-lg border border-gray-800 mb-3 overflow-hidden">
                            <div class="flex items-center justify-between p-3.5 cursor-pointer hover:bg-gray-800/60 transition-colors gap-2" onclick="toggleCollapsible('${dayBoxId}')">

                            <div id="${dayBoxId}" class="collapsible-content px-3 pb-3 border-t border-gray-800 pt-2.5 bg-bgDark/20">
                                ${subjectsHtml}
                            </div>
                        </div>
                    `;
                });

                let weekBoxId = `week-box-${wIdx}`;
                let isOpen = wIdx === 0 ? 'open' : '';

                    <div class="glass-panel overflow-hidden mb-4">

                                <p class="text-[11px] text-textMuted mt-0.5">${wLogs.length} oturum • ${wTotalTests} test • Toplam Soru: ${wTotalQs} (<span class="text-green-400 font-semibold">${wCorrect}D</span> / <span class="text-red-400 font-semibold">${wIncorrect}Y</span>)</p>
                            </div>
                            <div class="flex items-center gap-3 shrink-0">
                                <i id="icon-${weekBoxId}" class="fa-solid ${iconClass} w-4 text-center text-textMuted"></i>
                            </div>
                        </div>
                        <div id="${weekBoxId}" class="collapsible-content p-4 border-t border-gray-800 bg-bgDark/30 ${isOpen}">
                            ${datesHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = weeksHtml;
        }

        function deleteLogSession(logId) {
            if(!confirm("Bu çalışma kaydını silmek istediğine emin misin?")) return;
            let logIndex = state.dailyLogs.findIndex(l => l.id === logId);
            if(logIndex === -1) return;
            let log = state.dailyLogs[logIndex];
            let book = state.books.find(b => b.id === log.bookId);
            let topic = book ? book.topics.find(t => t.id === log.topicId) : null;
            if (topic) {
                topic.completedTests -= log.tests;
                if (topic.completedTests < 0) topic.completedTests = 0;
            }
            state.dailyLogs.splice(logIndex, 1);
            logHistory('Çalışma Kaydı Silindi', `${log.bookName}`);
            saveData();
            renderAll();
        }

        function logHistory(action, details) {
            state.history.unshift({
                id: generateId(), action, details,
                date: new Date().toLocaleString('tr-TR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})
            });
            if(state.history.length > 100) state.history.pop();
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            let html = state.history.map(h => `
                <div class="flex items-center justify-between py-2.5 px-2 border-b border-gray-800 hover:bg-gray-800 rounded transition-colors last:border-0 gap-2">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="bg-bgDark p-2 rounded text-accent border border-gray-700 shrink-0"><i class="fa-solid fa-clock-rotate-left text-xs"></i></div>
                        <div class="min-w-0">
                            <div class="text-xs sm:text-sm font-bold text-white truncate">${h.action}</div>
                            <div class="text-[11px] text-textMuted truncate">${h.details}</div>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-[10px] text-textMuted">${h.date}</div>
                    </div>
                </div>
            `).join('');
            container.innerHTML = html || '<p class="text-textMuted text-center py-4 text-xs">Henüz geçmiş kaydı yok.</p>';
        }

        let weeklyChartInstance = null;
        function renderChart() {
            const ctx = document.getElementById('weeklyChart');
            if(!ctx) return;
            let labels = []; let data = []; let totalQs = 0;
            for(let i=6; i>=0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                labels.push(d.toLocaleDateString('tr-TR', { weekday: 'short' }));
                let sum = state.dailyLogs.filter(l => l.date === dStr).reduce((a, b) => a + b.questions, 0);
                data.push(sum);
                totalQs += sum;
            }
            document.getElementById('weekly-total').innerText = `${totalQs} Soru`;
            if(weeklyChartInstance) weeklyChartInstance.destroy();
            weeklyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: '#8B5CF6', borderRadius: 4, barPercentage: 0.5 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#2D2D2D' }, ticks: { color: '#9CA3AF', font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { color: '#9CA3AF', font: { size: 10 } } }
                    }
                }
            });
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

                    <div class="space-y-2.5">

                            <label class="text-[11px] text-textMuted block mb-1">Kısım / Bölüm</label>

                        </div>
                        <div>
                            <label class="text-[11px] text-textMuted block mb-1">Konu Adı</label>
                            <input type="text" value="${name}" class="t-name w-full bg-cardDark border border-gray-600 rounded p-2 text-xs sm:text-sm text-white" required placeholder="Konu adı...">

                            <label class="text-[11px] text-textMuted block mb-1">Toplam Test</label>

        function handleBookSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editBookId').value;
            const sub = document.getElementById('bookSubject').value;
            const name = document.getElementById('bookName').value;
            let newTopics = Array.from(document.querySelectorAll('.topic-entry')).map(el => ({
                id: generateId(), name: el.querySelector('.t-name').value, chapter: el.querySelector('.t-chapter').value,
                totalTests: parseInt(el.querySelector('.t-tests').value), completedTests: 0 
            }));
            if(id) {
                let book = state.books.find(b => b.id === id);
                book.subject = sub; book.name = name; book.topics = newTopics;
            } else {
                state.books.push({ id: generateId(), subject: sub, name: name, topics: newTopics });
                logHistory('Yeni Kitap Eklendi', name);
            }
            saveData(); closeModal('bookModal');
            renderAll();
        }

        function openBookModalForEdit(id) {
            let book = state.books.find(b => b.id === id);
            document.getElementById('editBookId').value = book.id; 
            document.getElementById('bookSubject').value = book.subject; 
            document.getElementById('bookName').value = book.name;
            document.getElementById('bookModalTitle').innerText = 'Kitabı Düzenle'; 
            document.getElementById('book-extra-actions').classList.remove('hidden');
            document.getElementById('book-extra-actions').classList.add('flex');
            document.getElementById('topicsList').innerHTML = '';
            book.topics.forEach(t => addTopicField(t.name, t.chapter, t.totalTests)); 
            openModal('bookModal');
        }

        document.querySelector('button[onclick="openModal(\'bookModal\')"]').onclick = () => {
            document.getElementById('bookForm').reset(); 
            document.getElementById('editBookId').value = '';
            document.getElementById('bookModalTitle').innerText = 'Yeni Kitap Ekle'; 
            document.getElementById('book-extra-actions').classList.add('hidden');
            document.getElementById('book-extra-actions').classList.remove('flex');
            document.getElementById('topicsList').innerHTML = '';
            addTopicField(); 
            openModal('bookModal');
        };

        function openEditTopic(bId, tId, comp, tot) {
            document.getElementById('etBookId').value = bId; document.getElementById('etTopicId').value = tId;
            document.getElementById('etCompleted').value = comp; document.getElementById('etTotal').value = tot;
            openModal('editTopicModal');
        }

        function saveEditedTopic() {
            let bId = document.getElementById('etBookId').value; let tId = document.getElementById('etTopicId').value;
            let nComp = parseInt(document.getElementById('etCompleted').value); let nTot = parseInt(document.getElementById('etTotal').value);
            let book = state.books.find(b => b.id === bId); let topic = book.topics.find(t => t.id === tId);
            topic.completedTests = Math.min(nComp, nTot); topic.totalTests = nTot;
            logHistory('Konu İlerlemesi Düzenlendi', `${book.name} - ${topic.name}`);
            saveData(); closeModal('editTopicModal');
            renderAll();
        }

        window.onload = () => {
            document.getElementById('logDate').value = getTodayStr();
        };
    </script>
</body>
</html>
