<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çalışma Takibi & Öğretmen Koçluk Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0f172a',
                        cardDark: '#1e293b',
                        primary: '#3b82f6',
                        accent: '#8b5cf6',
                        streakFire: '#f97316'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDark text-white min-h-screen font-sans">

    <div id="loading-screen" class="flex flex-col items-center justify-center h-screen">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
        <p class="text-gray-400">Uygulama yükleniyor...</p>
    </div>

    <div id="login-screen" class="hidden flex flex-col items-center justify-center h-screen px-4">
        <div class="bg-cardDark p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-gray-800">
            <h1 class="text-3xl font-extrabold text-white mb-2">Çalışma Takibi</h1>
            <p class="text-gray-400 mb-8 text-sm">Giriş yaparak verilerinizi senkronize edin.</p>
            <button id="btn-google-login" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-3 shadow-lg">
                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Google ile Giriş Yap
            </button>
        </div>
    </div>

    <div id="app-screen" class="hidden min-h-screen pb-12">
        <header class="bg-cardDark border-b border-gray-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-primary">Çalışma Takibi</h1>
                    <span id="role-badge" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase">
                        Öğrenci
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <div id="user-display-name" class="text-sm font-semibold text-gray-300"></div>
                    <button id="btn-logout" class="bg-red-600/20 text-red-400 hover:bg-red-600/30 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                        Çıkış Yap
                    </button>
                </div>
            </div>
        </header>

        <div class="max-w-7xl mx-auto p-4 md:p-6 flex flex-col md:flex-row gap-6">
            
            <aside id="teacher-sidebar" class="hidden w-full md:w-1/4 bg-cardDark p-4 rounded-xl border border-gray-800 h-fit">
                <h2 class="text-md font-bold mb-3 pb-2 border-b border-gray-800 text-gray-200">Öğrencilerim</h2>
                <div id="students-list" class="space-y-2 max-h-96 overflow-y-auto pr-1">
                    </div>
            </aside>

            <main id="main-content-area" class="w-full flex-1 space-y-6">
                
                <div id="inspecting-banner" class="hidden bg-purple-900/40 border border-purple-500/50 p-3.5 rounded-xl flex justify-between items-center text-sm">
                    <span class="text-purple-200 font-medium">🔍 İncelemekte Olduğunuz Öğrenci: <b id="inspecting-student-name" class="text-white"></b></span>
                    <button id="btn-reset-inspect" class="text-xs bg-purple-600 hover:bg-purple-700 px-3 py-1.5 rounded-lg text-white font-bold transition">Kendi Profilime Dön</button>
                </div>

                <div class="bg-cardDark p-6 rounded-xl border border-gray-800 grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="p-4 bg-bgDark rounded-lg border border-gray-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-gray-400 font-semibold">Seviye & XP</span>
                            <span id="stat-level" class="text-xs font-bold text-accent">Lvl 1</span>
                        </div>
                        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden mb-1">
                            <div id="xp-bar" class="bg-accent h-full w-0 transition-all duration-300"></div>
                        </div>
                        <div id="stat-xp-text" class="text-[10px] text-gray-400 text-right">0 / 100 XP</div>
                    </div>

                    <div class="p-4 bg-bgDark rounded-lg border border-gray-800 flex items-center gap-3">
                        <div class="text-3xl">🔥</div>
                        <div>
                            <div class="text-xs text-gray-400 font-semibold">Günlük Seri</div>
                            <div id="stat-streak" class="text-xl font-bold text-streakFire">0 Gün</div>
                        </div>
                    </div>

                    <div class="p-4 bg-bgDark rounded-lg border border-gray-800">
                        <div class="text-xs text-gray-400 font-semibold">Toplam Soru</div>
                        <div id="stat-total-questions" class="text-2xl font-bold text-primary mt-1">0</div>
                    </div>

                    <div class="p-4 bg-bgDark rounded-lg border border-gray-800">
                        <div class="text-xs text-gray-400 font-semibold">Doğru Oranı</div>
                        <div id="stat-accuracy" class="text-2xl font-bold text-green-400 mt-1">%0</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <div class="bg-cardDark p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                        <div>
                            <h2 class="text-lg font-bold mb-4 text-primary">Günlük Çalışma Kaydı</h2>
                            <div id="student-write-controls" class="space-y-3 mb-6">
                                <input id="input-subject" type="text" placeholder="Ders & Konu Adı (Örn: Matematik - Türev)" class="w-full bg-bgDark border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-primary">
                                <div class="grid grid-cols-3 gap-2">
                                    <input id="input-questions" type="number" placeholder="Soru" class="bg-bgDark border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-primary">
                                    <input id="input-correct" type="number" placeholder="Doğru" class="bg-bgDark border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-primary">
                                    <input id="input-wrong" type="number" placeholder="Yanlış" class="bg-bgDark border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-primary">
                                </div>
                                <button id="btn-save-log" class="w-full bg-primary hover:bg-blue-600 py-2.5 rounded-lg font-bold text-sm transition">Kaydı Ekle (+20 XP)</button>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Çalışma Geçmişi</h3>
                            <div id="logs-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                </div>
                        </div>
                    </div>

                    <div class="bg-cardDark p-6 rounded-xl border border-gray-800">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-accent">Kitaplık & İlerleme</h2>
                        </div>
                        <div id="books-container" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                            </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // SİZİN FIREBASE BİLGİLERİNİZ BURAYA GELECEK
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDvRzmjUXKUQuYHSnc_nTboUk26cpvNkRk",
            authDomain: "studytrackerpublic.firebaseapp.com",
            projectId: "studytrackerpublic",
            storageBucket: "studytrackerpublic.firebasestorage.app",
            messagingSenderId: "539829878982",
            appId: "1:539829878982:web:6bc67e5d47adb8d4fd57c7",
            measurementId: "G-XD757SKL2P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentUserRole = 'student';
        let activeTargetUid = null; 

        const screens = {
            loading: document.getElementById('loading-screen'),
            login: document.getElementById('login-screen'),
            app: document.getElementById('app-screen')
        };

        function showScreen(name) {
            Object.keys(screens).forEach(k => screens[k].classList.add('hidden'));
            screens[name].classList.remove('hidden');
        }

        // OTURUM DİNLEYİCİSİ
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                activeTargetUid = user.uid;
                currentUserRole = await syncUserAndGetRole(user);

                document.getElementById('user-display-name').innerText = user.displayName || user.email;
                document.getElementById('role-badge').innerText = currentUserRole.toUpperCase();

                if (currentUserRole === 'teacher' || currentUserRole === 'admin') {
                    document.getElementById('teacher-sidebar').classList.remove('hidden');
                    loadStudentsList();
                } else {
                    document.getElementById('teacher-sidebar').classList.add('hidden');
                }

                showScreen('app');
                loadUserData(activeTargetUid);
            } else {
                currentUser = null;
                showScreen('login');
            }
        });

        async function syncUserAndGetRole(user) {
            const ref = doc(db, "users", user.uid);
            const snap = await getDoc(ref);
            if (!snap.exists()) {
                await setDoc(ref, {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || "Yeni Kullanıcı",
                    role: "student",
                    createdAt: new Date().toISOString()
                });
                return "student";
            }
            return snap.data().role || "student";
        }

        document.getElementById('btn-google-login').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                if (err.code === 'auth/popup-blocked') {
                    await signInWithRedirect(auth, provider);
                }
            }
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth);

        // ÖĞRETMEN LİSTESİ
        async function loadStudentsList() {
            const listEl = document.getElementById('students-list');
            listEl.innerHTML = '<p class="text-xs text-gray-500">Yükleniyor...</p>';
            try {
                const q = query(collection(db, "users"), where("role", "==", "student"));
                const snap = await getDocs(q);
                let html = '';
                snap.forEach(d => {
                    const st = d.data();
                    html += `
                        <button onclick="window.inspectStudent('${d.id}', '${st.displayName}')" class="w-full text-left p-3 bg-bgDark hover:bg-gray-800 rounded-lg text-xs border border-gray-800 transition flex justify-between items-center group">
                            <div>
                                <div class="font-bold text-gray-200 group-hover:text-primary transition">${st.displayName}</div>
                                <div class="text-[10px] text-gray-500">${st.email}</div>
                            </div>
                            <span class="text-[10px] text-primary font-bold">İncele &rarr;</span>
                        </button>
                    `;
                });
                listEl.innerHTML = html || '<p class="text-xs text-gray-500">Kayıtlı öğrenci yok.</p>';
            } catch (e) {
                listEl.innerHTML = '<p class="text-xs text-red-400">Öğrenciler yüklenemedi.</p>';
            }
        }

        window.inspectStudent = (uid, name) => {
            activeTargetUid = uid;
            document.getElementById('inspecting-banner').classList.remove('hidden');
            document.getElementById('inspecting-student-name').innerText = name;
            document.getElementById('student-write-controls').classList.add('hidden');
            loadUserData(uid);
        };

        document.getElementById('btn-reset-inspect').onclick = () => {
            activeTargetUid = currentUser.uid;
            document.getElementById('inspecting-banner').classList.add('hidden');
            document.getElementById('student-write-controls').classList.remove('hidden');
            loadUserData(currentUser.uid);
        };

        // ÖĞRENCİ VERİLERİNİ ÇEKME
        async function loadUserData(uid) {
            const logsContainer = document.getElementById('logs-list-container');
            const booksContainer = document.getElementById('books-container');
            logsContainer.innerHTML = '<p class="text-xs text-gray-500">Veriler çekiliyor...</p>';
            booksContainer.innerHTML = '<p class="text-xs text-gray-500">Kitaplar çekiliyor...</p>';

            try {
                // 1. Günlük Loglar
                const snap = await getDocs(collection(db, "users", uid, "logs"));
                let totalQ = 0, totalCorr = 0, totalWr = 0;
                let logsHtml = '';

                snap.forEach(d => {
                    const l = d.data();
                    totalQ += Number(l.questionCount || 0);
                    totalCorr += Number(l.correct || 0);
                    totalWr += Number(l.wrong || 0);

                    logsHtml += `
                        <div class="p-2.5 bg-bgDark rounded-lg border border-gray-800 flex justify-between items-center text-xs">
                            <div>
                                <div class="font-bold text-gray-200">${l.subject}</div>
                                <div class="text-[10px] text-gray-500">${l.date}</div>
                            </div>
                            <div class="text-right">
                                <span class="text-primary font-bold">${l.questionCount} Soru</span>
                                <div class="text-[10px] text-gray-400">D: ${l.correct || 0} | Y: ${l.wrong || 0}</div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('stat-total-questions').innerText = totalQ;
                const acc = totalQ > 0 ? Math.round((totalCorr / totalQ) * 100) : 0;
                document.getElementById('stat-accuracy').innerText = `%${acc}`;
                
                const xp = snap.size * 20;
                const lvl = Math.floor(xp / 100) + 1;
                const currentLvlXp = xp % 100;
                document.getElementById('stat-level').innerText = `Lvl ${lvl}`;
                document.getElementById('stat-xp-text').innerText = `${currentLvlXp} / 100 XP`;
                document.getElementById('xp-bar').style.width = `${currentLvlXp}%`;
                document.getElementById('stat-streak').innerText = snap.size > 0 ? `${snap.size} Gün` : '0 Gün';

                logsContainer.innerHTML = logsHtml || '<p class="text-xs text-gray-500">Kayıtlı çalışma bulunamadı.</p>';

                // 2. Kitaplık
                const booksSnap = await getDocs(collection(db, "users", uid, "books"));
                let booksHtml = '';

                booksSnap.forEach(d => {
                    const b = d.data();
                    booksHtml += `
                        <div class="p-3 bg-bgDark rounded-lg border border-gray-800 text-xs">
                            <div class="flex justify-between font-bold text-gray-200 mb-1">
                                <span>${b.name}</span>
                                <span class="text-accent">${b.completedTests || 0} / ${b.totalTests || 0} Test</span>
                            </div>
                            <div class="text-[10px] text-gray-500">${b.subject || ''}</div>
                        </div>
                    `;
                });

                booksContainer.innerHTML = booksHtml || '<p class="text-xs text-gray-500">Kayıtlı kitap bulunamadı.</p>';

            } catch (e) {
                logsContainer.innerHTML = '<p class="text-xs text-red-400">Veri yüklenirken hata oluştu.</p>';
            }
        }

        // ÇALIŞMA EKLEME
        document.getElementById('btn-save-log').onclick = async () => {
            if (activeTargetUid !== currentUser.uid) {
                alert("Öğretmen modundayken öğrencilerin yerine kayıt ekleyemezsiniz.");
                return;
            }

            const subject = document.getElementById('input-subject').value.trim();
            const q = document.getElementById('input-questions').value;
            const c = document.getElementById('input-correct').value;
            const w = document.getElementById('input-wrong').value;

            if (!subject || !q) return alert("Lütfen ders adını ve soru sayısını giriniz.");

            try {
                await addDoc(collection(db, "users", currentUser.uid, "logs"), {
                    subject,
                    questionCount: Number(q),
                    correct: Number(c) || 0,
                    wrong: Number(w) || 0,
                    date: new Date().toLocaleDateString('tr-TR'),
                    createdAt: new Date().toISOString()
                });

                document.getElementById('input-subject').value = '';
                document.getElementById('input-questions').value = '';
                document.getElementById('input-correct').value = '';
                document.getElementById('input-wrong').value = '';

                loadUserData(currentUser.uid);
            } catch (e) {
                alert("Kayıt eklenirken bir hata oluştu: " + e.message);
            }
        };
    </script>
</body>
</html>
